spring:
  application:
    name: ai-helpdesk
  datasource:
    url: jdbc:h2:file:./data/helpdesk
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

helpdesk:
  seed:
    enabled: true
  retrieval:
    mode: LEXICAL   # LEXICAL (default) | VECTOR | HYBRID. VECTOR/HYBRID use VectorRetrieverAdapter with the in-process embeddings store (sop_embedding).
  llm:
    base-url: ${HELPDESK_LLM_BASE_URL:https://api.openai.com/v1}
    api-key: ${HELPDESK_LLM_API_KEY:}
    model: ${HELPDESK_LLM_MODEL:gpt-4o-mini}
    system-prompt: >-
      You are an internal IT support assistant. You guide employees through a
      predefined SOP step by step. You must ONLY choose a branchKey that is
      explicitly enumerated for the current step, or return null. You may never
      invent steps or skip required steps. If the employee indicates the problem
      is resolved, return intent RESOLVE. If it cannot be resolved by the SOP,
      return intent ESCALATE with a reason. Keep replies concise and in the
      employee's language.

  ticket:
    endpoint: ${HELPDESK_TICKET_ENDPOINT:}   # full URL to POST escalated cases; blank => internal-only (no-op degrade)
  translation:
    base-url: ${HELPDESK_TRANSLATION_BASE_URL:}
    api-key: ${HELPDESK_TRANSLATION_API_KEY:}
    model: ${HELPDESK_TRANSLATION_MODEL:}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always

  security:
    # Master switch for SSO / RBAC (BRD §7). OFF by default so the app stays open
    # for local dev, offline runs, and the existing unauthenticated test suite.
    # Flip to true (or set HELPDESK_SECURITY_ENABLED=true) to enforce OIDC login
    # on /api/** (except /api/health) and role checks on the admin endpoints.
    enabled: ${HELPDESK_SECURITY_ENABLED:false}
    # OIDC / SSO settings — consumed by SecurityConfig to build Spring Security's
    # OAuth2 client (oauth2Login). Inert unless helpdesk.security.enabled=true.
    # Inject real values via env vars; never commit secrets.
    oidc:
      registration-id: helpdesk
      client-id: ${HELPDESK_OIDC_CLIENT_ID:change-me}
      client-secret: ${HELPDESK_OIDC_CLIENT_SECRET:change-me}
      scope: openid,profile,email
      authorization-uri: ${HELPDESK_OIDC_AUTH_URI:https://idp.example.com/oauth2/authorize}
      token-uri: ${HELPDESK_OIDC_TOKEN_URI:https://idp.example.com/oauth2/token}
      jwk-set-uri: ${HELPDESK_OIDC_JWK_URI:https://idp.example.com/oauth2/jwks}
      user-info-uri: ${HELPDESK_OIDC_USERINFO_URI:https://idp.example.com/oauth2/userinfo}
      user-name-attribute: sub
      redirect-uri: ${HELPDESK_OIDC_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
      # OIDC claim carrying the user's roles (e.g. Keycloak "groups", Auth0 "roles").
      roles-claim: groups

# HTTPS / TLS readiness (BRD §7). Enable in production: terminate TLS here or at
# a reverse proxy, then set the session cookie `secure` and send HSTS.
# server:
#   port: 8443
#   ssl:
#     enabled: true
#     key-store: classpath:keystore.p12
#     key-store-type: PKCS12
#     key-store-password: ${SSL_KEYSTORE_PASSWORD}
#     key-alias: helpdesk
#   servlet:
#     session:
#       cookie:
#         secure: true

server:
  port: 8080

logging:
  level:
    root: INFO
    com.helpdesk: INFO
