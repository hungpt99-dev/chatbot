spring:
  application:
    name: ai-helpdesk
  datasource:
    url: jdbc:h2:file:./data/helpdesk
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

helpdesk:
  seed:
    enabled: true

server:
  port: 8080

logging:
  level:
    root: INFO
    com.helpdesk: INFO
